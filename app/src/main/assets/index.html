<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1e293b">
<link rel="manifest" href="manifest.json">
<title>Nokia 3310 Snake II</title>
<style>
  :root {
    --lcd-bg: #9bbc0f;
    --lcd-mid: #8bac0f;
    --lcd-dark: #306230;
    --lcd-ink: #0f380f;
    --body-navy: #1d2b44;
    --bezel-silver: #c9d1d9;
  }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  body {
    margin: 0; padding: 0; background: #0d1117; color: #fff;
    font-family: 'Courier New', Courier, monospace;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; overflow: hidden;
  }
  .handset {
    width: 360px; max-width: 96vw; background: linear-gradient(145deg, #243552, #152033);
    border-radius: 46px 46px 56px 56px; padding: 18px 20px 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 2px 4px rgba(255,255,255,0.2);
    border: 3px solid #0f1724; display: flex; flex-direction: column; align-items: center;
  }
  .earpiece {
    width: 60px; height: 8px; background: #0b111a; border-radius: 4px;
    margin-bottom: 10px; box-shadow: inset 0 1px 2px rgba(255,255,255,0.15);
  }
  .brand {
    font-family: sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 3px;
    color: #cbd5e1; margin-bottom: 8px;
  }
  .bezel {
    background: var(--bezel-silver); padding: 12px 14px 16px;
    border-radius: 18px 18px 28px 28px; width: 100%;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.45);
    display: flex; flex-direction: column; align-items: center;
  }
  .lcd-container {
    position: relative; width: 288px; height: 208px;
    background: var(--lcd-bg); border: 4px solid #4a5568; border-radius: 6px;
    box-shadow: inset 0 3px 8px rgba(0,0,0,0.35); overflow: hidden;
  }
  canvas {
    width: 100%; height: 100%; image-rendering: pixelated; display: block;
  }
  .lcd-grid {
    position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(15,56,15,0.06) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(15,56,15,0.06) 1px, transparent 1px);
    background-size: 3px 3px;
  }
  .controls-row {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; margin: 14px 0 10px; padding: 0 8px;
  }
  .btn-soft {
    background: #334155; color: #e2e8f0; border: 2px solid #0f172a;
    border-radius: 14px; padding: 8px 14px; font-weight: bold; font-size: 12px;
    cursor: pointer; box-shadow: 0 4px 0 #0f172a; active: translateY(2px);
  }
  .btn-soft:active, .key:active, .btn-navi:active { transform: translateY(2px); box-shadow: 0 1px 0 #0f172a; }
  .btn-navi {
    background: linear-gradient(180deg, #3b82f6, #1d4ed8); color: #fff;
    border: 2px solid #0f172a; border-radius: 20px; width: 110px; height: 38px;
    font-weight: 800; font-size: 13px; letter-spacing: 1px; cursor: pointer;
    box-shadow: 0 4px 0 #0f172a;
  }
  .keypad {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%;
  }
  .key {
    background: linear-gradient(180deg, #e2e8f0, #94a3b8); color: #0f172a;
    border: 2px solid #0f172a; border-radius: 18px; height: 48px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 4px 0 #0f172a;
  }
  .key.dir { background: linear-gradient(180deg, #fde047, #eab308); }
  .key span { font-size: 9px; font-weight: 700; opacity: 0.75; }
</style>
</head>
<body>
<div class="handset">
  <div class="earpiece"></div>
  <div class="brand">NOKIA</div>
  <div class="bezel">
    <div class="lcd-container">
      <canvas id="lcd" width="144" height="104"></canvas>
      <div class="lcd-grid"></div>
    </div>
  </div>
  <div class="controls-row">
    <button class="btn-soft" id="btnMute">C / MUTE</button>
    <button class="btn-navi" id="btnNavi">NAVI / OK</button>
    <button class="btn-soft" id="btnMode">MODE ▲▼</button>
  </div>
  <div class="keypad">
    <button class="key" data-key="1">1<span>SPD-</span></button>
    <button class="key dir" data-dir="UP">2<span>▲ UP</span></button>
    <button class="key" data-key="3">3<span>SPD+</span></button>
    <button class="key dir" data-dir="LEFT">4<span>◄ LEFT</span></button>
    <button class="key" data-dir="ACTION">5<span>● PAUSE</span></button>
    <button class="key dir" data-dir="RIGHT">6<span>RIGHT ►</span></button>
    <button class="key" data-key="7">7<span>MAZE</span></button>
    <button class="key dir" data-dir="DOWN">8<span>▼ DOWN</span></button>
    <button class="key" data-key="9">9<span>RESET</span></button>
  </div>
</div>

<script>
const canvas = document.getElementById('lcd');
const ctx = canvas.getContext('2d');
const COLS = 36, ROWS = 22, CELL = 4, TOP_BAR = 16;

let speedLevel = 5;
let mazeIndex = 0;
const MAZES = ['BOX', 'OPEN', 'CROSS', 'TUNNEL'];
let muted = false;
let state = 'MENU'; // MENU, PLAY, PAUSE, OVER
let score = 0;
let highScores = JSON.parse(localStorage.getItem('snake2_hi') || '{"BOX":0,"OPEN":0,"CROSS":0,"TUNNEL":0}');

let snake = [];
let dir = {x: 1, y: 0};
let inputQueue = [];
let food = null;
let critter = null;
let dotsEaten = 0;
let walls = [];
let lastTick = 0;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function beep(freq, dur) {
  if (muted) return;
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.value = 0.06;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur / 1000);
  } catch(e) {}
}

function buildWalls() {
  walls = [];
  const m = MAZES[mazeIndex];
  if (m === 'BOX') {
    for (let x = 0; x < COLS; x++) { walls.push({x, y: 0}, {x, y: ROWS - 1}); }
    for (let y = 1; y < ROWS - 1; y++) { walls.push({x: 0, y}, {x: COLS - 1, y}); }
  } else if (m === 'CROSS') {
    for (let x = 8; x < COLS - 8; x++) walls.push({x, y: Math.floor(ROWS / 2)});
    for (let y = 4; y < ROWS - 4; y++) walls.push({x: Math.floor(COLS / 2), y});
  } else if (m === 'TUNNEL') {
    for (let x = 6; x < COLS - 6; x++) { walls.push({x, y: 5}, {x, y: ROWS - 6}); }
  }
}

function isOccupied(x, y) {
  if (walls.some(w => w.x === x && w.y === y)) return true;
  if (snake.some(s => s.x === x && s.y === y)) return true;
  if (food && food.x === x && food.y === y) return true;
  if (critter && critter.x === x && critter.y === y) return true;
  return false;
}

function spawnFood() {
  let x, y;
  do {
    x = Math.floor(Math.random() * COLS);
    y = Math.floor(Math.random() * ROWS);
  } while (isOccupied(x, y));
  food = {x, y};
}

function spawnCritter() {
  let x, y;
  do {
    x = Math.floor(Math.random() * (COLS - 2)) + 1;
    y = Math.floor(Math.random() * (ROWS - 2)) + 1;
  } while (isOccupied(x, y));
  critter = {x, y, timer: 45};
  beep(1200, 60);
}

function initGame() {
  buildWalls();
  snake = [
    {x: 10, y: 11, bulge: false},
    {x: 9, y: 11, bulge: false},
    {x: 8, y: 11, bulge: false},
    {x: 7, y: 11, bulge: false}
  ];
  dir = {x: 1, y: 0};
  inputQueue = [];
  score = 0;
  dotsEaten = 0;
  critter = null;
  spawnFood();
  state = 'PLAY';
  beep(880, 80);
}

function queueDir(nx, ny) {
  const last = inputQueue.length ? inputQueue[inputQueue.length - 1] : dir;
  if (last.x + nx !== 0 || last.y + ny !== 0) {
    if (inputQueue.length < 2) inputQueue.push({x: nx, y: ny});
  }
}

function step() {
  if (inputQueue.length) dir = inputQueue.shift();
  const head = snake[0];
  let nx = (head.x + dir.x + COLS) % COLS;
  let ny = (head.y + dir.y + ROWS) % ROWS;

  if (walls.some(w => w.x === nx && w.y === ny) || snake.some(s => s.x === nx && s.y === ny)) {
    state = 'OVER';
    beep(220, 350);
    const m = MAZES[mazeIndex];
    if (score > (highScores[m] || 0)) {
      highScores[m] = score;
      localStorage.setItem('snake2_hi', JSON.stringify(highScores));
    }
    return;
  }

  const ateFood = food && nx === food.x && ny === food.y;
  const ateCritter = critter && Math.abs(nx - critter.x) <= 1 && Math.abs(ny - critter.y) <= 1;

  snake.unshift({x: nx, y: ny, bulge: ateFood || ateCritter});

  if (ateFood) {
    score += speedLevel * 2;
    dotsEaten++;
    beep(1046, 45);
    spawnFood();
    if (dotsEaten % 5 === 0) spawnCritter();
  } else if (ateCritter) {
    score += critter.timer * speedLevel;
    critter = null;
    beep(1568, 90);
  } else {
    snake.pop();
  }

  if (critter) {
    critter.timer--;
    if (critter.timer <= 0) critter = null;
  }
}

function draw() {
  ctx.fillStyle = '#9bbc0f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Top Status Bar
  ctx.fillStyle = '#0f380f';
  ctx.fillRect(0, 14, canvas.width, 1);
  ctx.font = 'bold 10px monospace';
  ctx.fillText(String(score).padStart(4, '0'), 2, 11);
  ctx.fillText(MAZES[mazeIndex].slice(0,3) + ' L' + speedLevel, 52, 11);
  if (critter) {
    ctx.fillRect(105, 4, Math.floor((critter.timer / 45) * 36), 6);
  } else if (muted) {
    ctx.fillText('M', 134, 11);
  }

  if (state === 'MENU') {
    ctx.fillText('SNAKE II', 46, 42);
    ctx.fillText('MAZE: ' + MAZES[mazeIndex], 36, 60);
    ctx.fillText('SPEED: ' + speedLevel, 42, 74);
    ctx.fillText('PRESS NAVI', 38, 94);
    return;
  }

  // Walls
  ctx.fillStyle = '#0f380f';
  walls.forEach(w => ctx.fillRect(w.x * CELL, TOP_BAR + w.y * CELL, CELL, CELL));

  // Food
  if (food) {
    ctx.fillRect(food.x * CELL + 1, TOP_BAR + food.y * CELL, 2, 4);
    ctx.fillRect(food.x * CELL, TOP_BAR + food.y * CELL + 1, 4, 2);
  }

  // Critter
  if (critter) {
    ctx.fillRect(critter.x * CELL - 1, TOP_BAR + critter.y * CELL - 1, 6, 6);
  }

  // Snake
  snake.forEach((s, i) => {
    const pad = s.bulge ? -1 : 0;
    ctx.fillRect(s.x * CELL + pad, TOP_BAR + s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2);
  });

  if (state === 'PAUSE') {
    ctx.fillStyle = '#9bbc0f';
    ctx.fillRect(34, 46, 76, 22);
    ctx.strokeStyle = '#0f380f';
    ctx.strokeRect(34, 46, 76, 22);
    ctx.fillStyle = '#0f380f';
    ctx.fillText('PAUSED', 52, 61);
  } else if (state === 'OVER') {
    ctx.fillStyle = '#9bbc0f';
    ctx.fillRect(22, 38, 100, 38);
    ctx.strokeStyle = '#0f380f';
    ctx.strokeRect(22, 38, 100, 38);
    ctx.fillStyle = '#0f380f';
    ctx.fillText('GAME OVER', 42, 52);
    ctx.fillText('HI: ' + String(highScores[MAZES[mazeIndex]] || 0).padStart(4, '0'), 44, 68);
  }
}

function loop(ts) {
  const interval = Math.max(45, 210 - speedLevel * 18);
  if (state === 'PLAY' && ts - lastTick >= interval) {
    step();
    lastTick = ts;
  }
  draw();
  requestAnimationFrame(loop);
}

document.querySelectorAll('[data-dir]').forEach(btn => {
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const d = btn.dataset.dir;
    if (d === 'ACTION') {
      if (state === 'PLAY') state = 'PAUSE';
      else if (state === 'PAUSE') state = 'PLAY';
      else initGame();
      return;
    }
    if (state !== 'PLAY') return;
    if (d === 'UP') queueDir(0, -1);
    if (d === 'DOWN') queueDir(0, 1);
    if (d === 'LEFT') queueDir(-1, 0);
    if (d === 'RIGHT') queueDir(1, 0);
  });
});

document.querySelectorAll('[data-key]').forEach(btn => {
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const k = btn.dataset.key;
    if (k === '1') { speedLevel = Math.max(1, speedLevel - 1); beep(600, 30); }
    if (k === '3') { speedLevel = Math.min(9, speedLevel + 1); beep(800, 30); }
    if (k === '7') { mazeIndex = (mazeIndex + 1) % MAZES.length; beep(700, 30); }
    if (k === '9') { state = 'MENU'; beep(400, 50); }
  });
});

document.getElementById('btnNavi').addEventListener('pointerdown', () => {
  if (state === 'MENU' || state === 'OVER') initGame();
  else if (state === 'PLAY') state = 'PAUSE';
  else if (state === 'PAUSE') state = 'PLAY';
});

document.getElementById('btnMute').addEventListener('pointerdown', () => {
  muted = !muted;
});

document.getElementById('btnMode').addEventListener('pointerdown', () => {
  if (state === 'PLAY') return;
  mazeIndex = (mazeIndex + 1) % MAZES.length;
  beep(750, 40);
});

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' || e.key === '2' || e.key === 'w') queueDir(0, -1);
  if (e.key === 'ArrowDown' || e.key === '8' || e.key === 's') queueDir(0, 1);
  if (e.key === 'ArrowLeft' || e.key === '4' || e.key === 'a') queueDir(-1, 0);
  if (e.key === 'ArrowRight' || e.key === '6' || e.key === 'd') queueDir(1, 0);
  if (e.key === 'Enter' || e.key === ' ') {
    if (state === 'MENU' || state === 'OVER') initGame();
    else state = (state === 'PLAY') ? 'PAUSE' : 'PLAY';
  }
});

requestAnimationFrame(loop);
</script>
</body>
</html>
